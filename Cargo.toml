[package]
name = "nf-switcher"
version = "0.1.6"
edition = "2021"
description = "NF Switcher: pick, per app, whether it uses Wi-Fi or Windows' default route"
publish = false

# Every crate here was already in the local cargo cache (2026-10-18): nothing is downloaded to build.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-numerics = "0.3"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_WiFi",
  "Win32_NetworkManagement_WindowsFilteringPlatform",
  "Win32_System_Rpc",
  "Win32_Networking_WinHttp",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
]

[features]
# Builds the installer (bin nf-switcher-setup). It embeds the app, so it needs NFSW_APP_EXE pointing at a release
# build of nf-switcher.exe: tools/build-setup.ps1 does both steps.
setup = []

[[bin]]
name = "nf-switcher"
path = "src/main.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[[bin]]
name = "nf-switcher-setup"
path = "src/bin/setup.rs"
required-features = ["setup"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
